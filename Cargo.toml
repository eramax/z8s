[package]
name = "z8s"
version = "0.1.0"
edition = "2021"
description = "A minimal, fast init process and Kubernetes-compatible orchestrator"

[dependencies]
tokio = { version = "1", features = ["full"] }
k8s-openapi = { version = "0.27", features = ["v1_32"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
nix = { version = "0.31", features = ["fs", "signal", "sched", "mount", "process", "term", "ioctl"] }
oci-distribution = "0.11"
flate2 = "1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
notify = "8"
anyhow = { version = "1", features = ["backtrace"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "ws", "query"] }
tower-http = { version = "0.6", features = ["cors"] }
hyper = { version = "1", features = ["full"] }
http = "1"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
