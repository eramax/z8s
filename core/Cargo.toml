[package]
name = "core"
version = "0.1.0"
edition = "2024"
description = "Shared types, store backend, event bus, and syscall helpers for z8s"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
redb = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
libc = "0.2"
async-trait = "0.1"
tracing = "0.1"
