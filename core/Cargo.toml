[package]
name = "core"
version = "0.1.0"
edition = "2024"
description = "Shared types, store backend, event bus, and syscall helpers for z8s"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
redb = "4.1.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1.0.102"
rustix = { version = "1.1.4", features = ["process", "fs", "mount", "thread", "pipe", "net", "system"] }
async-trait = "0.1.89"
tracing = "0.1.44"
