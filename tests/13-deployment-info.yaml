apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hello
  namespace: default
  labels:
    app: nginx-hello
    type: info-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-hello
  template:
    metadata:
      labels:
        app: nginx-hello
    spec:
      containers:
      - name: nginx-hello
        image: nginxdemos/hello:latest
        ports:
        - containerPort: 80
        env:
        - name: HELLO_MESSAGE
          value: "Hello from z8s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: default
  labels:
    app: whoami
    type: info-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:latest
        ports:
        - containerPort: 80
        env:
        - name: WHOAMI_MODE
          value: "z8s-test"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
  namespace: default
  labels:
    app: http-echo
    type: info-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-echo
  template:
    metadata:
      labels:
        app: http-echo
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:latest
        args: ["-text=hello from z8s"]
        ports:
        - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostinfo
  namespace: default
  labels:
    app: hostinfo
    type: info-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostinfo
  template:
    metadata:
      labels:
        app: hostinfo
    spec:
      containers:
      - name: hostinfo
        image: maximleus/hostinfo:latest
        ports:
        - containerPort: 8080
        env:
        - name: HOSTINFO_MODE
          value: "z8s"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-hello-svc
  namespace: default
  labels:
    app: nginx-hello
spec:
  type: ClusterIP
  selector:
    app: nginx-hello
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-svc
  namespace: default
  labels:
    app: whoami
spec:
  type: ClusterIP
  selector:
    app: whoami
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: http-echo-svc
  namespace: default
  labels:
    app: http-echo
spec:
  type: ClusterIP
  selector:
    app: http-echo
  ports:
  - name: http
    port: 5678
    targetPort: 5678
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: hostinfo-svc
  namespace: default
  labels:
    app: hostinfo
spec:
  type: ClusterIP
  selector:
    app: hostinfo
  ports:
  - name: http
    port: 18081
    targetPort: 8080
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-dashboard
  namespace: default
  labels:
    app: cluster-dashboard
    type: info-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-dashboard
  template:
    metadata:
      labels:
        app: cluster-dashboard
    spec:
      containers:
      - name: dashboard
        image: eramax/cluster-dashboard:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-dashboard-svc
  namespace: default
  labels:
    app: cluster-dashboard
spec:
  type: ClusterIP
  selector:
    app: cluster-dashboard
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
