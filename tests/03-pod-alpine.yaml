apiVersion: v1
kind: Pod
metadata:
  name: alpine-pod
  namespace: default
  labels:
    app: alpine
    type: test-pod
spec:
  containers:
  - name: alpine
    image: alpine:latest
    command: ["sleep", "infinity"]
    env:
    - name: DIRECT_ENV
      value: direct-value
    - name: POD_NAME
      value: alpine-pod
    envFrom:
    - configMapRef:
        name: app-config
    - secretRef:
        name: app-secret
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
    - name: secret-volume
      mountPath: /etc/secret
    - name: data
      mountPath: /var/data
  volumes:
  - name: config-volume
    configMap:
      name: app-config
  - name: secret-volume
    secret:
      secretName: app-secret
  - name: data
    emptyDir: {}
