apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_LOG_LEVEL: info
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8080
    database:
      host: localhost
      port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: z8s-test
data:
  APP_ENV: staging
  APP_DEBUG: "true"
  APP_LOG_LEVEL: debug
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  nginx.conf: |
    server {
        listen       80;
        server_name  localhost;
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
    }
