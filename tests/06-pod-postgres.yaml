apiVersion: v1
kind: Pod
metadata:
  name: postgres-pod
  namespace: default
  labels:
    app: postgres
    type: test-pod
spec:
  containers:
  - name: postgres
    image: postgres:16-alpine
    env:
    - name: POSTGRES_USER
      value: admin
    - name: POSTGRES_PASSWORD
      value: password123
    - name: POSTGRES_DB
      value: testdb
    - name: PGDATA
      value: /var/lib/postgresql/data/pgdata
    volumeMounts:
    - name: postgres-data
      mountPath: /var/lib/postgresql/data
  volumes:
  - name: postgres-data
    emptyDir: {}
