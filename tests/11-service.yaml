apiVersion: v1
kind: Service
metadata:
  name: alpine-svc
  namespace: default
  labels:
    app: alpine
spec:
  type: ClusterIP
  selector:
    app: alpine
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-svc
  namespace: z8s-test
  labels:
    app: ubuntu
spec:
  type: ClusterIP
  selector:
    app: ubuntu
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: python-svc
  namespace: default
  labels:
    app: python
spec:
  type: ClusterIP
  selector:
    app: python
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: python-nodeport
  namespace: default
  labels:
    app: python
spec:
  type: NodePort
  selector:
    app: python
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
---
