apiVersion: v1
kind: Pod
metadata:
  name: python-pod
  namespace: default
  labels:
    app: python
    type: test-pod
spec:
  securityContext:
    runAsUser: 2000
    runAsNonRoot: true
  containers:
  - name: python
    image: python:3-slim
    command: ["python3", "-m", "http.server", "8080"]
    env:
    - name: APP_ENV
      value: production
    - name: LOG_LEVEL
      value: info
    volumeMounts:
    - name: config
      mountPath: /etc/config
    - name: cache
      mountPath: /var/cache
    - name: host-tmp
      mountPath: /host-tmp
  volumes:
  - name: config
    configMap:
      name: app-config
      items:
      - key: config.yaml
        path: app-config.yaml
  - name: cache
    emptyDir: {}
  - name: host-tmp
    hostPath:
      path: /tmp
      type: Directory
