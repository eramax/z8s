apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-deploy
  namespace: default
  labels:
    app: python
    type: deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python
  template:
    metadata:
      labels:
        app: python
    spec:
      containers:
      - name: python
        image: python:3-slim
        ports:
        - containerPort: 18080
        command: ["/bin/sh", "-c"]
        args:
        - |
          exec python3 -c "
          from http.server import HTTPServer, SimpleHTTPRequestHandler
          HTTPServer(('0.0.0.0', 18080), SimpleHTTPRequestHandler).serve_forever()
          "
        env:
        - name: APP_ENV
          value: production
        volumeMounts:
        - name: config
          mountPath: /etc/config
      volumes:
      - name: config
        configMap:
          name: app-config
          items:
          - key: config.yaml
            path: app-config.yaml
