apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine-deploy
  namespace: default
  labels:
    app: alpine
    type: deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alpine
  template:
    metadata:
      labels:
        app: alpine
    spec:
      containers:
      - name: alpine
        image: alpine:latest
        command: ["sleep", "infinity"]
        env:
        - name: DEPLOY_NAME
          value: alpine-deploy
        envFrom:
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: config
          mountPath: /etc/config
      volumes:
      - name: config
        configMap:
          name: app-config
