apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-dashboard
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-dashboard-operator
  namespace: default
rules:
  - apiGroups: ["", "apps", "z8s.io"]
    resources:
      - pods
      - deployments
      - services
      - replicasets
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-dashboard-operator
  namespace: default
subjects:
  - kind: ServiceAccount
    name: cluster-dashboard
    namespace: default
roleRef:
  kind: Role
  name: cluster-dashboard-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-dashboard
  namespace: default
  labels:
    app: cluster-dashboard
    type: info-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-dashboard
  template:
    metadata:
      labels:
        app: cluster-dashboard
    spec:
      serviceAccountName: cluster-dashboard
      containers:
        - name: dashboard
          image: eramax/cluster-dashboard:latest
          ports:
            - containerPort: 80
          env:
            - name: KUBECONFIG
              value: /var/run/secrets/z8s.io/serviceaccount/kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-dashboard-svc
  namespace: default
  labels:
    app: cluster-dashboard
spec:
  type: ClusterIP
  selector:
    app: cluster-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-access
  namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: rbac-deny-test
  namespace: default
spec:
  serviceAccountName: no-access
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
