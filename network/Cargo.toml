[package]
name = "network"
version = "0.1.0"
edition = "2024"
description = "Networking: veth, nftables (raw netlink), DNS, IPAM, ingress, network policy"

[dependencies]
z8s_core = { path = "../core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
anyhow = "1.0.102"
rustix = { version = "1.1.4", features = ["process", "fs", "mount", "thread", "pipe", "net", "system", "runtime", "stdio", "termios"] }
async-trait = "0.1.89"
tracing = "0.1.44"
