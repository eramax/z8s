[package]
name = "network"
version = "0.1.0"
edition = "2024"
description = "Networking: veth pairs, nftables, DNS, IPAM, ingress, network policies"

[dependencies]
z8s_core = { path = "../core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
anyhow = "1.0.102"
rustix = { version = "1.1.4", features = ["process", "fs", "mount", "thread", "pipe", "net", "system", "runtime", "stdio", "termios"] }
async-trait = "0.1.89"
tracing = "0.1.44"
ipnetwork = "0.21"
rustables = { path = "../.cargo-patches/rustables-0.8.7" }

[dev-dependencies]
tempfile = "3.13"
